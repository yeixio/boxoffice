name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    name: Go (${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Lint
        run: make lint
      - name: Test
        env:
          BOXOFFICE_TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable' || '' }}
        run: go test -count=1 -race ./...

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm test
        working-directory: web
      - run: pnpm build
        working-directory: web

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/boxoffice
      - run: helm template t deploy/helm/boxoffice > /dev/null
      # SQLite by default; any PostgreSQL setting switches to it.
      - run: "! helm template t deploy/helm/boxoffice | grep -q BOXOFFICE_DATABASE_URL"
      - run: "helm template t deploy/helm/boxoffice --set postgresql.enabled=true | grep -q 'kind: StatefulSet'"
      - run: "helm template t deploy/helm/boxoffice --set database.url=postgres://u:p@db/boxoffice | grep -q BOXOFFICE_DATABASE_URL"
      - run: "helm template t deploy/helm/boxoffice --set apiKey.value=k --set tmdb.apiKey=t | grep -q BOXOFFICE_API_KEY"
      - run: "helm template t deploy/helm/boxoffice --set downloads.subPath=bo --set downloads.volume.emptyDir.medium= | grep -q BOXOFFICE_DOWNLOADS_DIR"
      - run: helm template t deploy/helm/boxoffice --set 'media[0].name=movies' --set 'media[0].mountPath=/media/movies' --set 'media[0].volume.emptyDir.medium=' > /dev/null

  # Pushes from main publish ghcr.io/yeixio/boxoffice:main and :sha-<short>;
  # pull requests only build.
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=main-${{ github.sha }}
          # Empty on pull requests and forks, which then build without a TMDB key.
          secrets: |
            tmdb_key=${{ secrets.TMDB_API_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Once main's image is pushed, the image-ready branch moves to that commit.
  # A deployment that follows image-ready (as the home lab's Argo CD app
  # does, with image.tag sha-<its commit>) only ever asks for an image that
  # exists, instead of sitting in ImagePullBackOff while the build runs, or
  # for good when it fails. It never moves backwards, so an older build
  # finishing last leaves it alone.
  image-ready:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [go, web, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: image-ready
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Move image-ready to this commit
        run: |
          if git fetch origin image-ready 2>/dev/null && ! git merge-base --is-ancestor FETCH_HEAD "$GITHUB_SHA"; then
            echo "image-ready is already at a newer commit; leaving it"
            exit 0
          fi
          git push --force origin "$GITHUB_SHA:refs/heads/image-ready"
